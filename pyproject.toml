[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-translator"
version = "3.1.0"
description = "Traduction de PDF (texte, tableaux, images, mise en forme) avec conservation de la structure d'origine"
requires-python = ">=3.9"
dependencies = [
    "pdfplumber",
    "pymupdf",
    "deep-translator",
    "reportlab",
    "pillow",
    "pytesseract",
]

[project.scripts]
pdf-translator = "pdf_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
