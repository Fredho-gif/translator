<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter..." rel="stylesheet">
    <!-- TipTap (éditeur riche) via CDN -->
  <script type="module">
  import { Editor } from 'https://esm.sh/@tiptap/core@2';
  import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2';

  // On expose TipTap globalement pour pouvoir l'utiliser plus tard
  window.TipTap = { Editor, StarterKit };
</script>
  <title>pdf_translator_pro — Éditeur</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #f5f3ee; color: #2c2c2c; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 280px; background: #2c2c2c; color: #e8e6e1; padding: 20px; overflow-y: auto; }
    .sidebar h2 { font-size: 16px; letter-spacing: 1px; font-weight: normal; padding-bottom: 12px; border-bottom: 1px solid #555; margin-bottom: 16px; }
    .sidebar ul { list-style: none; }
    .sidebar li { padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 4px; transition: background 0.15s; }
    .sidebar li:hover { background: #3d3d3d; }
    .sidebar li.active { background: #8a6d3b; color: #fff; }
    .editor { flex: 1; padding: 60px 80px; max-width: 900px; margin: 0 auto; width: 100%; overflow-y: auto; }
    .editor h1 { font-size: 32px; margin-bottom: 24px; color: #2c2c2c; }
    .editor .content { font-size: 18px; line-height: 1.8; color: #444; white-space: pre-wrap; }
    .placeholder { color: #999; font-style: italic; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>📖 MES CHAPITRES</h2>
      <ul id="chapter-list">
        <li class="placeholder">Chargement…</li>
      </ul>
    </aside>

   <main class="editor">
  <div class="editor-inner">
    <h1 id="chapter-title">Sélectionne un chapitre</h1>
    <div class="meta" id="chapter-meta">
      Choisis un chapitre à gauche pour commencer à lire ou écrire.
    </div>    <button id="btn-save" style="margin-bottom: 20px; padding: 10px 20px; background: #8a6d3b; color: white; border: none; border-radius: 6px; cursor: pointer;">
      💾 Enregistrer
    </button>


    <!-- Éditeur TipTap (zone principale) -->
    <div id="tiptap-editor" style="border: 1px solid #e8e3d9; border-radius: 10px; padding: 20px; min-height: 400px; background: #fff; font-family: 'Lora', serif; font-size: 18px; line-height: 1.7;"></div>
  </div>
</main>
  </div>

 
  <script>
    async function loadChapters() {
      const listEl = document.getElementById('chapter-list');
      listEl.innerHTML = '<li class="placeholder">Chargement…</li>';

      try {
        const res = await fetch('/chapters');
        const data = await res.json();

        listEl.innerHTML = '';
        data.chapters.forEach(ch => {
          const li = document.createElement('li');
          li.textContent = ch.title;
          li.dataset.id = ch.id;
          li.onclick = () => showChapter(ch, li);
          listEl.appendChild(li);
        });
      } catch (err) {
        listEl.innerHTML = '<li class="placeholder">Erreur de chargement</li>';
        console.error(err);
      }
    }

          function showChapter(ch, li) {
      document.querySelectorAll('#chapter-list li')
        .forEach(el => el.classList.remove('active'));
      li.classList.add('active');

      document.getElementById('chapter-title').textContent = ch.title;
      document.getElementById('chapter-meta').textContent =
        `Chapitre ${ch.id} · ${ch.content.split(' ').length} mots`;

      if (editor) {
        editor.commands.setContent(`<p>${ch.content}</p>`);
      }
    }
       // ---- Éditeur TipTap ----
    let editor = null;

    document.addEventListener('DOMContentLoaded', () => {
      const { Editor, StarterKit } = window.TipTap;

      editor = new Editor({
        element: document.getElementById('tiptap-editor'),
        extensions: [StarterKit],
        content: '',
      });
    });
        // ---- Bouton Enregistrer ----
    document.getElementById('btn-save').addEventListener('click', async () => {
      if (!editor) return;
      
      const title = document.getElementById('chapter-title').textContent;
      // On cherche l'ID du chapitre actif
      const activeLi = document.querySelector('#chapter-list li.active');
      if (!activeLi) return alert('Ouvre un chapitre d abord !');
      
      const id = activeLi.dataset.id;
      const content = editor.getHTML();

      try {
        const res = await fetch(`/chapters/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: content })
        });
        
        if (res.ok) {
          alert('✅ Chapitre sauvegardé !');
        } else {
          alert('❌ Erreur de sauvegarde');
        }
      } catch (err) {
        console.error(err);
        alert('❌ Erreur réseau');
      }
    });
    loadChapters();
  </script>
</body>
</html>
