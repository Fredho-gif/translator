<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>pdf_translator_pro — Éditeur</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #f5f3ee; color: #2c2c2c; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 280px; background: #2c2c2c; color: #e8e6e1; padding: 20px; overflow-y: auto; }
    .sidebar h2 { font-size: 16px; letter-spacing: 1px; font-weight: normal; padding-bottom: 12px; border-bottom: 1px solid #555; margin-bottom: 16px; }
    .sidebar ul { list-style: none; }
    .sidebar li { padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 4px; transition: background 0.15s; }
    .sidebar li:hover { background: #3d3d3d; }
    .sidebar li.active { background: #8a6d3b; color: #fff; }
    .editor { flex: 1; padding: 60px 80px; max-width: 900px; margin: 0 auto; width: 100%; overflow-y: auto; }
    .editor h1 { font-size: 32px; margin-bottom: 24px; color: #2c2c2c; }
    .editor .content { font-size: 18px; line-height: 1.8; color: #444; white-space: pre-wrap; }
    .placeholder { color: #999; font-style: italic; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>📖 MES CHAPITRES</h2>
      <ul id="chapter-list">
        <li class="placeholder">Chargement…</li>
      </ul>
    </aside>

    <main class="editor">
      <h1 id="chapter-title">Sélectionne un chapitre</h1>
      <div id="chapter-content" class="content placeholder">
        Clique sur un chapitre à gauche pour commencer.
      </div>
    </main>
  </div>

  <script>
    async function loadChapters() {
      const listEl = document.getElementById('chapter-list');
      listEl.innerHTML = '<li class="placeholder">Chargement…</li>';

      try {
        const res = await fetch('/chapters');
        const data = await res.json();

        listEl.innerHTML = '';
        data.chapters.forEach(ch => {
          const li = document.createElement('li');
          li.textContent = ch.title;
          li.dataset.id = ch.id;
          li.onclick = () => showChapter(ch, li);
          listEl.appendChild(li);
        });
      } catch (err) {
        listEl.innerHTML = '<li class="placeholder">Erreur de chargement</li>';
        console.error(err);
      }
    }

    function showChapter(ch, li) {
      document.querySelectorAll('#chapter-list li')
        .forEach(el => el.classList.remove('active'));
      li.classList.add('active');

      const titleEl = document.getElementById('chapter-title');
      const contentEl = document.getElementById('chapter-content');

      titleEl.textContent = ch.title;
      contentEl.textContent = ch.content;
      contentEl.classList.remove('placeholder');
    }

    loadChapters();
  </script>
</body>
</html>
